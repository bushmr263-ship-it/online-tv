<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PB TV - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .login-box, .support-box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 320px;
            box-sizing: border-box;
        }
        h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #00ffcc;
        }
        .support-box h3 {
            color: #60a5fa;
            font-size: 18px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button, .contact-btn {
            width: 100%;
            padding: 10px;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
        }
        button:hover {
            background-color: #00b38f;
        }
        .whatsapp-btn {
            background-color: #22c55e;
            color: white;
        }
        .telegram-btn {
            background-color: #0284c7;
            color: white;
        }
        .call-btn {
            background-color: #f59e0b;
            color: #121212;
        }
        #error-msg {
            color: #ff4d4d;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }
        .support-text {
            text-align: center;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Form Box -->
        <div class="login-box">
            <h2>PB TV Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">ইউজারনেম</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">পাসওয়ার্ড</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">লগইন করুন</button>
                <div id="error-msg"></div>
            </form>
        </div>

        <!-- Support & Contact Box -->
        <div class="support-box">
            <h3>সহায়তা ও যোগাযোগ</h3>
            <p class="support-text">সরাসরি যোগাযোগ করুন কোনো প্রয়োজনে:</p>
            
            <a href="https://wa.me/8801812895985" target="_blank" class="contact-btn whatsapp-btn">
                WhatsApp (01812895985)
            </a>
            
            <a href="https://t.me/your_telegram_channel" target="_blank" class="contact-btn telegram-btn">
                টেলিগ্রাম চ্যানেল
            </a>
            
            <a href="tel:01812895985" class="contact-btn call-btn">
                সরাসরি কল করুন
            </a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            
            errorMsg.textContent = "লগইন হচ্ছে, অপেক্ষা করুন...";

            let deviceId = localStorage.getItem("pb_device_id");
            if (!deviceId) {
                deviceId = "Device-" + Math.random().toString(36).substring(2, 9);
                localStorage.setItem("pb_device_id", deviceId);
            }

            try {
                const response = await fetch("https://admin.bushmr263.workers.dev/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput,
                        deviceId: deviceId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("pb_logged_username", usernameInput);
                    window.location.href = "index.html";
                } else {
                    errorMsg.textContent = data.message;
                }
            } catch (error) {
                console.error("Error:", error);
                errorMsg.textContent = "সার্ভারে সংযোগ করতে সমস্যা হয়েছে!";
            }
        });
    </script>

</body>
</html>
