<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PB TV - লগইন</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .header-title { text-align: center; color: #f59e0b; font-size: 26px; font-weight: bold; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; max-width: 900px; width: 100%; }
        
        .login-box, .support-box { background-color: #111a3a; padding: 25px; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 380px; box-sizing: border-box; }
        h3 { margin-top: 0; margin-bottom: 20px; color: #f59e0b; font-size: 18px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .support-box h3 { color: #60a5fa; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border: 1px solid #334155; background-color: #0b1329; color: #fff; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 14px; }
        input:focus { border-color: #f59e0b; }
        
        button, .contact-btn { width: 100%; padding: 12px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; display: block; box-sizing: border-box; font-size: 15px; }
        button { background-color: #f59e0b; color: #0b1329; }
        button:hover { background-color: #d97706; }
        
        .whatsapp-btn { background-color: #16a34a; color: white; }
        .telegram-btn { background-color: #0284c7; color: white; }
        .call-btn { background-color: #f59e0b; color: #0b1329; }
        
        #error-msg { color: #ef4444; text-align: center; font-size: 14px; margin-top: 10px; }
        .support-text { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header-title">
        <i class="fa-solid fa-tv"></i> পিবি টিভি লগইন প্যানেল
    </div>

    <div class="container">
        <!-- Login Form Box -->
        <div class="login-box">
            <h3><i class="fa-solid fa-user"></i> ইউজার লগইন করুন</h3>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">ইউজারনেম দিন</label>
                    <input type="text" id="username" placeholder="ইউজারনেম দিন" required>
                </div>
                <div class="input-group">
                    <label for="password">পাসওয়ার্ড দিন</label>
                    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required>
                </div>
                <button type="submit">লগইন করুন</button>
                <div id="error-msg"></div>
            </form>
        </div>

        <!-- Support & Contact Box -->
        <div class="support-box">
            <h3><i class="fa-solid fa-headset"></i> সহায়তা ও যোগাযোগ</h3>
            <p class="support-text">সরাসরি যোগাযোগ করুন কোনো প্রয়োজনে:</p>
            
            <a href="https://wa.me/8801812895985" target="_blank" class="contact-btn whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp (01812895985)
            </a>
            
            <a href="https://t.me/your_telegram_channel" target="_blank" class="contact-btn telegram-btn">
                <i class="fa-solid fa-paper-plane"></i> টেলিগ্রাম চ্যানেল
            </a>
            
            <a href="tel:01812895985" class="contact-btn call-btn">
                <i class="fa-solid fa-phone"></i> সরাসরি কল করুন
            </a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            
            errorMsg.textContent = "লগইন হচ্ছে, অপেক্ষা করুন...";

            let deviceId = localStorage.getItem("pb_device_id");
            if (!deviceId) {
                deviceId = "Device-" + Math.random().toString(36).substring(2, 9);
                localStorage.setItem("pb_device_id", deviceId);
            }

            try {
                const response = await fetch("https://admin.bushmr263.workers.dev/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput,
                        deviceId: deviceId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("pb_logged_username", usernameInput);
                    window.location.href = "index.html";
                } else {
                    errorMsg.textContent = data.message;
                }
            } catch (error) {
                console.error("Error:", error);
                errorMsg.textContent = "সার্ভারে সংযোগ করতে সমস্যা হয়েছে!";
            }
        });
    </script>

</body>
</html>
