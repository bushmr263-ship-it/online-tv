    <script>
        // Security Controls
        ['contextmenu', 'selectstart', 'copy', 'cut', 'dragstart'].forEach(eventType => {
            document.addEventListener(eventType, e => e.preventDefault());
        });

        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'u', 'S', 's', 'C', 'c', 'P', 'p'].includes(e.key))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        function checkDevTools() {
            const widthThreshold = window.outerWidth - window.innerWidth > 160;
            const heightThreshold = window.outerHeight - window.innerHeight > 160;
            
            if (widthThreshold || heightThreshold) {
                document.body.innerHTML = "<div style='background:black;height:100vh;display:flex;justify-content:center;align-items:center;'><h1 style='color:red;font-family:sans-serif;text-align:center;'>⛔ Security Alert: Developer Tools are blocked on this site!</h1></div>";
                window.location.href = "about:blank";
            }
        }
        setInterval(checkDevTools, 300);

        // Player & Category Filter Logic
        const videoEl = document.getElementById('my-video');
        const iframe = document.getElementById('custom-iframe');
        const clapprEl = document.getElementById('clappr-container');
        const html5El = document.getElementById('html5-video');
        let playerInstance = videojs('my-video'); // Video.js instance
        let clapprInstance;
        let hls; 
        let dashPlayer;
        let currentMode = 'videojs';
        let currentUrl = '';
        let allChannels = [];
        let currentFilter = 'all';

        function togglePIP() {
            if (videoEl.style.display !== 'none' && document.pictureInPictureEnabled) {
                videoEl.requestPictureInPicture();
            }
        }

        function switchMode(mode) {
            if (currentUrl) loadChannelUrl(currentUrl, mode);
        }

        function loadChannel(ch) {
            const buttonsContainer = document.getElementById('serverButtonsContainer');
            const channelNameEl = document.getElementById('activeChannelName');

            buttonsContainer.innerHTML = '';

            let urls = Array.isArray(ch.url) ? ch.url : [ch.url];
            channelNameEl.innerText = ch.name + " - সার্ভার পরিবর্তন করুন";

            urls.forEach((link, index) => {
                const sBtn = document.createElement('button');
                sBtn.className = 'server-btn';
                sBtn.innerText = `Server ${index + 1}`;
                if (index === 0) sBtn.classList.add('active');

                sBtn.onclick = () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    sBtn.classList.add('active');
                    loadChannelUrl(link, currentMode);
                };
                buttonsContainer.appendChild(sBtn);
            });

            loadChannelUrl(urls[0], currentMode);
        }

        function loadChannelUrl(url, mode) {
            let finalUrl = url;

            currentUrl = url; 
            currentMode = mode;

            videoEl.style.display = 'none';
            iframe.style.display = 'none';
            clapprEl.style.display = 'none';
            html5El.style.display = 'none';
            
            if (hls) { hls.destroy(); hls = null; }
            if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
            if (clapprInstance) { clapprInstance.destroy(); clapprInstance = null; }
            
            playerInstance.pause();
            html5El.pause();
            html5El.src = "";
            iframe.src = "about:blank";

            // ফুল ভলিউম এবং সাউন্ড নিশ্চিত করার ফাংশন
            const setMaxVolumeAndPlay = (mediaObj, isVjs = false) => {
                if (isVjs) {
                    mediaObj.muted(false);
                    mediaObj.volume(1.0); // 100% Volume
                    mediaObj.play().catch(() => {
                        mediaObj.muted(true); // ব্রাউজার ব্লক করলে মিউট করে প্লে করবে
                        mediaObj.play();
                    });
                } else {
                    mediaObj.muted = false;
                    mediaObj.volume = 1.0; // 100% Volume
                    let playPromise = mediaObj.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            mediaObj.muted = true;
                            mediaObj.play();
                        });
                    }
                }
            };

            if (mode === 'iframe') {
                iframe.src = finalUrl;
                iframe.style.display = 'block';
            } else if (mode === 'clappr') {
                clapprEl.style.display = 'block';
                clapprInstance = new Clappr.Player({
                    source: finalUrl, 
                    parentId: "#clappr-container", 
                    width: '100%', 
                    height: '100%', 
                    autoPlay: true,
                    mute: false
                });
            } else if (mode === 'html5') {
                html5El.style.display = 'block';
                html5El.src = finalUrl;
                setMaxVolumeAndPlay(html5El, false);
            } else {
                videoEl.style.display = 'block';
                
                if (finalUrl.includes('.mpd') || finalUrl.includes('dash')) {
                    if (typeof dashjs !== 'undefined') {
                        dashPlayer = dashjs.MediaPlayer().create();
                        dashPlayer.initialize(videoEl, finalUrl, true);
                        setMaxVolumeAndPlay(playerInstance, true);
                    } else {
                        playerInstance.src({ src: finalUrl });
                        setMaxVolumeAndPlay(playerInstance, true);
                    }
                } else if (Hls.isSupported()) {
                    // High-Load Optimized Low-Latency Engine Configuration
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 30,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 6,
                        maxBufferLength: 8,
                        maxMaxBufferLength: 15,
                        manifestLoadingTimeOut: 10000,
                        manifestLoadingMaxRetry: 4,
                        levelLoadingTimeOut: 10000,
                        levelLoadingMaxRetry: 4,
                        fragLoadingTimeOut: 15000,
                        fragLoadingMaxRetry: 6
                    });

                    hls.loadSource(finalUrl);
                    hls.attachMedia(videoEl);

                    // Auto Network Failover Recovery
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        setMaxVolumeAndPlay(playerInstance, true);
                    });
                } else {
                    playerInstance.src({ src: finalUrl });
                    setMaxVolumeAndPlay(playerInstance, true);
                }
            }
        }

        function playCustom() {
            const url = document.getElementById('customUrlInput').value;
            if(url) {
                document.getElementById('serverButtonsContainer').innerHTML = "";
                document.getElementById('activeChannelName').innerText = "Custom URL - সার্ভার পরিবর্তন করুন";
                loadChannelUrl(url, currentMode);
            }
        }

        function renderChannels() {
            const container = document.getElementById('channelContainer');
            container.innerHTML = '';

            let filteredChannels = allChannels.filter(ch => {
                if (currentFilter === 'all') return true;
                return ch.group && ch.group.toLowerCase() === currentFilter.toLowerCase();
            });

            if (filteredChannels.length > 0) {
                filteredChannels.forEach(ch => {
                    const btn = document.createElement('div');
                    btn.className = 'ch-btn';
                    
                    let img = document.createElement('img');
                    img.src = ch.logo;
                    img.onerror = () => { img.src = "https://i.postimg.cc/W1z5BGPZ/20240823_024712.png"; };
                    
                    let strong = document.createElement('strong');
                    strong.innerText = ch.name;
                    
                    btn.appendChild(img);
                    btn.appendChild(strong);
                    
                    btn.onclick = () => loadChannel(ch);
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = '<p style="text-align: center; color: #888; grid-column: span 4; padding: 20px;">এই ক্যাটাগরিতে কোনো চ্যানেল পাওয়া যায়নি।</p>';
            }
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentFilter = category;
            renderChannels();
        }

        // Categorization Engine & Multi-Server Parser with Cache Bypass
        const playlistUrl = 'https://raw.githubusercontent.com/bushmr263-ship-it/online-tv/main/playlist.m3u?t=' + new Date().getTime();

        fetch(playlistUrl, { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                const lines = data.split(/\r?\n/);
                allChannels = [];
                
                let currentTitle = '';
                let currentLogo = 'https://i.postimg.cc/W1z5BGPZ/20240823_024712.png';
                let currentGroup = '';

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();

                    if (line.startsWith('#EXTINF')) {
                        let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        currentLogo = logoMatch ? logoMatch[1] : 'https://i.postimg.cc/W1z5BGPZ/20240823_024712.png';
                        
                        let groupMatch = line.match(/group-title="([^"]+)"/);
                        currentGroup = groupMatch ? groupMatch[1].trim().toLowerCase() : '';
                        
                        let nameParts = line.split(',');
                        currentTitle = nameParts[nameParts.length - 1].trim();
                    } 
                    else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            let rawUrls = [];
                            let matches = line.match(/(https?:\/\/[^\s]+)/g);
                            if (matches) {
                                rawUrls = matches.map(u => u.trim());
                            } else {
                                rawUrls = [line];
                            }

                            let lowerTitle = currentTitle.toLowerCase();
                            let detectedGroup = 'other';

                            if (
                                currentGroup.includes('sport') || lowerTitle.includes('sport') || lowerTitle.includes('cricket') || 
                                lowerTitle.includes('football') || lowerTitle.includes('willow') || lowerTitle.includes('ten') || 
                                lowerTitle.includes('bein') || lowerTitle.includes('ptv') || lowerTitle.includes('dazan') || 
                                lowerTitle.includes('spiler') || lowerTitle.includes('prajm') || lowerTitle.includes('goal tv') || 
                                lowerTitle.includes('tsn') || lowerTitle.includes('tnt sport') || lowerTitle.includes('fifa') || 
                                lowerTitle.includes('fb tv') || lowerTitle.includes('setanta') || lowerTitle.includes('unite 8') || 
                                lowerTitle.includes('go 3') || lowerTitle.includes('fox')
                            ) {
                                detectedGroup = 'sports';
                            } 
                            else if (
                                currentGroup.includes('docu') || lowerTitle.includes('documentary') || lowerTitle.includes('discovery') || 
                                lowerTitle.includes('nat geo') || lowerTitle.includes('national geo') || lowerTitle.includes('animal planet') || 
                                lowerTitle.includes('history') || lowerTitle.includes('science') || lowerTitle.includes('earth') || 
                                lowerTitle.includes('wild') || lowerTitle.includes('investigation') || lowerTitle.includes('crime') || 
                                lowerTitle.includes('turbo') || lowerTitle.includes('travel') || lowerTitle.includes('weather') || lowerTitle.includes('pikstan')
                            ) {
                                detectedGroup = 'documentary';
                            }
                            else if (
                                currentGroup.includes('cartoon') || currentGroup.includes('kids') || lowerTitle.includes('cartoon') || 
                                lowerTitle.includes('duronto') || lowerTitle.includes('nick') || lowerTitle.includes('pogo') || 
                                lowerTitle.includes('hungama') || lowerTitle.includes('disney') || lowerTitle.includes('motu patlu') || 
                                lowerTitle.includes('tom & jerry') || lowerTitle.includes('doraemon') || lowerTitle.includes('mr bean') || 
                                lowerTitle.includes('sony yay') || lowerTitle.includes('rongeen')
                            ) {
                                detectedGroup = 'cartoon';
                            }
                            else if (
                                currentGroup.includes('music') || lowerTitle.includes('music') || lowerTitle.includes('9xm') || 
                                lowerTitle.includes('9x') || lowerTitle.includes('m tv') || lowerTitle.includes('zing') || 
                                lowerTitle.includes('mastiii') || lowerTitle.includes('sangeet')
                            ) {
                                detectedGroup = 'music';
                            }
                            else if (
                                currentGroup.includes('indian_bangla') || currentGroup.includes('indian') || lowerTitle.includes('jalsha') || 
                                lowerTitle.includes('zee bangla') || lowerTitle.includes('colors bangla') || lowerTitle.includes('sun bangla') || 
                                lowerTitle.includes('sananda') || lowerTitle.includes('zb cinema')
                            ) {
                                detectedGroup = 'indian_bangla';
                            }
                            else if (
                                currentGroup.includes('hindi') || lowerTitle.includes('movies') || lowerTitle.includes('movie club') || 
                                lowerTitle.includes('star gold') || lowerTitle.includes('sony max') || lowerTitle.includes('zee tv') || 
                                lowerTitle.includes('zee cinema') || lowerTitle.includes('bollywood') || lowerTitle.includes('goldmines') || 
                                lowerTitle.includes('gold mines') || lowerTitle.includes('pictures') || lowerTitle.includes('&pictures') || 
                                lowerTitle.includes('shemaroo') || lowerTitle.includes('action hollywood') || lowerTitle.includes('b4u') || 
                                lowerTitle.includes('star maa') || lowerTitle.includes('roja') || lowerTitle.includes('south indian') || 
                                lowerTitle.includes('hbo') || lowerTitle.includes('cineplex') || lowerTitle.includes('cinema') || 
                                lowerTitle.includes('rishtey') || lowerTitle.includes('colors hindi') || lowerTitle.includes('dhinchaak') || 
                                lowerTitle.includes('enterr10') || lowerTitle.includes('manoranjan') || lowerTitle.includes('classic 24') || 
                                lowerTitle.includes('sony sab') || lowerTitle.includes('sony pal') || lowerTitle.includes('star plus') || 
                                lowerTitle.includes('star bharat') || lowerTitle.includes('utv') || lowerTitle.includes('bhojpuri') || 
                                lowerTitle.includes('pitaara') || lowerTitle.includes('english movie') || lowerTitle.includes('sony movies')
                            ) {
                                detectedGroup = 'hindi';
                            }
                            else {
                                detectedGroup = 'bangla';
                            }

                            allChannels.push({
                                name: currentTitle,
                                logo: currentLogo,
                                group: detectedGroup,
                                url: rawUrls
                            });
                        }
                    }
                    currentTitle = '';
                }
            }
            renderChannels();
        })
        .catch(error => {
            console.error('Error fetching playlist:', error);
            document.getElementById('channelContainer').innerHTML = '<p style="text-align: center; color: red; grid-column: span 4; padding: 20px;">চ্যানেল লোড করতে সমস্যা হয়েছে।</p>';
        });
    </script>
</body>
</html>
