    <script>
        // Security Controls
        ['contextmenu', 'selectstart', 'copy', 'cut', 'dragstart'].forEach(eventType => {
            document.addEventListener(eventType, e => e.preventDefault());
        });

        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'u', 'S', 's', 'C', 'c', 'P', 'p'].includes(e.key))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        function checkDevTools() {
            const widthThreshold = window.outerWidth - window.innerWidth > 160;
            const heightThreshold = window.outerHeight - window.innerHeight > 160;
            
            if (widthThreshold || heightThreshold) {
                document.body.innerHTML = "<div style='background:black;height:100vh;display:flex;justify-content:center;align-items:center;'><h1 style='color:red;font-family:sans-serif;text-align:center;'>⛔ Security Alert: Developer Tools are blocked on this site!</h1></div>";
                window.location.href = "about:blank";
            }
        }
        setInterval(checkDevTools, 1000);

        // Player & Category Filter Logic
        const videoEl = document.getElementById('my-video');
        const clapprEl = document.getElementById('clappr-container');
        const html5El = document.getElementById('html5-video');
        let playerInstance = videojs('my-video', { autoplay: true });
        let clapprInstance;
        let hls; 
        let dashPlayer;
        let currentMode = 'shaka';
        let currentUrl = '';
        let allChannels = [];
        let currentFilter = 'all';
        let currentChannelObj = null;
        let currentServerIndex = 0;
        let stallCheckInterval = null;
        let shakaPlayerRef = null;
        let shakaUiRef = null;

        async function initPlayer() {
          const video = document.getElementById("video");
          const container = document.getElementById("player-container");
          const status = document.getElementById("status");

          try {
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
              status.textContent = "Browser Not Supported";
              return;
            }

            const player = new shaka.Player();
            shakaPlayerRef = player;
            await player.attach(video);

            const ui = new shaka.ui.Overlay(
              player,
              container,
              video
            );
            shakaUiRef = ui;

            ui.configure({
              addBigPlayButton: true,
              controlPanelElements: [
                "play_pause",
                "mute",
                "time_and_duration",
                "spacer",
                "quality",
                "picture_in_picture",
                "fullscreen"
              ]
            });

            // নিজের অনুমোদিত ভিডিও স্ট্রিম URL এখানে দিন
            const streamUrl = "YOUR_AUTHORIZED_STREAM_URL";

            status.textContent = "Loading...";

            await player.load(streamUrl);

            status.textContent = "Ready";
            video.play().catch(() => {});

            video.addEventListener("playing", () => {
              status.textContent = "Playing";
            });

            player.addEventListener("error", (event) => {
              status.textContent =
                "Playback Error: " + event.detail.code;
            });

          } catch (error) {
            status.textContent = "Unable to Play Video";
            console.error(error);
          }
        }

        document.addEventListener(
          "DOMContentLoaded",
          initPlayer
        );

        function togglePIP() {
            const shakaContainer = document.getElementById("player-container");
            const shakaVideo = document.getElementById("video");
            if (shakaContainer && shakaContainer.style.display !== 'none' && document.pictureInPictureEnabled) {
                shakaVideo.requestPictureInPicture().catch(() => {});
            } else if (videoEl.style.display !== 'none' && document.pictureInPictureEnabled) {
                videoEl.requestPictureInPicture();
            } else if (html5El.style.display !== 'none' && document.pictureInPictureEnabled) {
                html5El.requestPictureInPicture().catch(() => {});
            }
        }

        function switchMode(mode) {
            if (currentUrl) loadChannelUrl(currentUrl, mode);
        }

        function loadChannel(ch) {
            currentChannelObj = ch;
            currentServerIndex = 0;
            const buttonsContainer = document.getElementById('serverButtonsContainer');
            const channelNameEl = document.getElementById('activeChannelName');

            buttonsContainer.innerHTML = '';

            let urls = Array.isArray(ch.url) ? ch.url : [ch.url];
            channelNameEl.innerText = ch.name + " - সার্ভার পরিবর্তন করুন";

            urls.forEach((link, index) => {
                const sBtn = document.createElement('button');
                sBtn.className = 'server-btn';
                sBtn.innerText = `Server ${index + 1}`;
                if (index === 0) sBtn.classList.add('active');

                sBtn.onclick = () => {
                    currentServerIndex = index;
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    sBtn.classList.add('active');
                    loadChannelUrl(link, currentMode);
                };
                buttonsContainer.appendChild(sBtn);
            });

            loadChannelUrl(urls[0], currentMode);
        }

        function handleFallback() {
            if (!currentChannelObj) return;
            let urls = Array.isArray(currentChannelObj.url) ? currentChannelObj.url : [currentChannelObj.url];
            
            if (currentServerIndex < urls.length - 1) {
                currentServerIndex++;
                
                const serverBtns = document.querySelectorAll('.server-btn');
                serverBtns.forEach((b, idx) => {
                    if (idx === currentServerIndex) {
                        b.classList.add('active');
                    } else {
                        b.classList.remove('active');
                    }
                });

                loadChannelUrl(urls[currentServerIndex], currentMode);
            }
        }

        function setManualQualityByHeight(targetHeight, btnEl) {
            document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            if (hls) {
                if (targetHeight === -1) {
                    hls.currentLevel = -1;
                    return;
                }

                if (hls.levels && hls.levels.length > 1) {
                    let closestIndex = -1;
                    let minDiff = Infinity;

                    hls.levels.forEach((level, index) => {
                        if (level.height) {
                            let diff = Math.abs(level.height - targetHeight);
                            if (diff < minDiff) {
                                minDiff = diff;
                                closestIndex = index;
                            }
                        }
                    });

                    if (closestIndex !== -1) {
                        hls.currentLevel = closestIndex;
                    }
                }
            }
        }

        async function loadChannelUrl(url, mode = 'shaka') {
            let finalUrl = url;

            currentUrl = url; 
            currentMode = mode;

            const shakaContainer = document.getElementById("player-container");
            const shakaVideo = document.getElementById("video");
            const shakaStatus = document.getElementById("status");

            videoEl.style.display = 'none';
            clapprEl.style.display = 'none';
            html5El.style.display = 'none';
            shakaContainer.style.display = 'none';
            
            if (stallCheckInterval) clearInterval(stallCheckInterval);
            if (hls) { hls.destroy(); hls = null; }
            if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
            if (clapprInstance) { clapprInstance.destroy(); clapprInstance = null; }
            
            playerInstance.pause();
            html5El.pause();
            html5El.src = "";

            const qBtns = document.querySelectorAll('.q-btn');
            qBtns.forEach((b, i) => {
                if (i === 0) b.classList.add('active');
                else b.classList.remove('active');
            });

            const triggerInstantPlay = (mediaObj, isVjs = false) => {
                if (isVjs) {
                    mediaObj.muted(false);
                    mediaObj.volume(1.0);
                    let promise = mediaObj.play();
                    if (promise !== undefined) {
                        promise.catch(() => {
                            mediaObj.muted(true);
                            mediaObj.play();
                        });
                    }
                } else {
                    mediaObj.muted = false;
                    mediaObj.volume = 1.0;
                    let playPromise = mediaObj.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            mediaObj.muted = true;
                            mediaObj.play();
                        });
                    }
                }
            };

            if (mode === 'clappr') {
                if (shakaPlayerRef) await shakaPlayerRef.unload().catch(() => {});
                clapprEl.style.display = 'block';
                clapprInstance = new Clappr.Player({
                    source: finalUrl, 
                    parentId: "#clappr-container", 
                    width: '100%', 
                    height: '100%', 
                    autoPlay: true,
                    mute: false
                });
            } else if (mode === 'html5') {
                if (shakaPlayerRef) await shakaPlayerRef.unload().catch(() => {});
                html5El.style.display = 'block';
                html5El.src = finalUrl;
                triggerInstantPlay(html5El, false);
                html5El.onerror = () => handleFallback();
            } else if (mode === 'videojs') {
                if (shakaPlayerRef) await shakaPlayerRef.unload().catch(() => {});
                videoEl.style.display = 'block';
                
                if (finalUrl.includes('.mpd') || finalUrl.includes('dash')) {
                    if (typeof dashjs !== 'undefined') {
                        dashPlayer = dashjs.MediaPlayer().create();
                        dashPlayer.initialize(videoEl, finalUrl, true);
                        triggerInstantPlay(playerInstance, true);
                    } else {
                        playerInstance.src({ src: finalUrl, type: 'application/dash+xml' });
                        triggerInstantPlay(playerInstance, true);
                    }
                } else if (Hls.isSupported() && !finalUrl.includes('.mpd')) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: false,
                        maxBufferLength: 60,
                        maxMaxBufferLength: 120,
                        maxBufferSize: 60 * 1024 * 1024,
                        backBufferLength: 30,
                        liveSyncDurationCount: 6,
                        liveMaxLatencyDurationCount: 15,
                        fragLoadingTimeOut: 20000,
                        fragLoadingMaxRetry: 4,
                        fragLoadingRetryDelay: 1000,
                        manifestLoadingMaxRetry: 4,
                        levelLoadingMaxRetry: 4
                    });

                    hls.loadSource(finalUrl);
                    hls.attachMedia(videoEl);

                    hls.on(Hls.Events.MEDIA_ATTACHED, () => {
                        triggerInstantPlay(playerInstance, true);
                    });

                    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                        triggerInstantPlay(playerInstance, true);
                    });

                    let lastTime = 0;
                    let stallCount = 0;
                    stallCheckInterval = setInterval(() => {
                        if (videoEl && !videoEl.paused) {
                            if (videoEl.currentTime === lastTime) {
                                stallCount++;
                                if (stallCount >= 3) {
                                    if (hls) hls.startLoad();
                                    stallCount = 0;
                                }
                            } else {
                                stallCount = 0;
                                lastTime = videoEl.currentTime;
                            }
                        }
                    }, 2000);

                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    if (videoEl.canPlayType('application/vnd.apple.mpegurl') || finalUrl.includes('.m3u8')) {
                                        hls.destroy();
                                        hls = null;
                                        videoEl.src = finalUrl;
                                        triggerInstantPlay(playerInstance, true);
                                    } else {
                                        handleFallback();
                                    }
                                    break;
                            }
                        }
                    });
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    videoEl.src = finalUrl;
                    triggerInstantPlay(playerInstance, true);
                } else {
                    playerInstance.src({ src: finalUrl, type: 'application/x-mpegURL' });
                    triggerInstantPlay(playerInstance, true);
                }
            } else {
                shakaContainer.style.display = 'block';
                if (!shakaPlayerRef) {
                    await initPlayer();
                }
                if (shakaPlayerRef && finalUrl) {
                    try {
                        shakaStatus.textContent = "Loading...";
                        await shakaPlayerRef.load(finalUrl);
                        shakaStatus.textContent = "Ready";
                        shakaVideo.play().catch(() => {});
                    } catch (error) {
                        shakaStatus.textContent = "Unable to Play Video";
                        console.error(error);
                    }
                }
            }
        }

        function playCustom() {
            const url = document.getElementById('customUrlInput').value;
            if(url) {
                document.getElementById('serverButtonsContainer').innerHTML = "";
                document.getElementById('activeChannelName').innerText = "Custom URL - সার্ভার পরিবর্তন করুন";
                currentChannelObj = null;
                loadChannelUrl(url, currentMode);
            }
        }

        function renderChannels() {
            const container = document.getElementById('channelContainer');
            container.innerHTML = '';

            let filteredChannels = allChannels.filter(ch => {
                if (currentFilter === 'all') return true;
                if (!ch.group) return false;
                
                let chGroup = ch.group.toLowerCase().replace(/[\s_]+/g, '');
                let targetGroup = currentFilter.toLowerCase().replace(/[\s_]+/g, '');
                
                return chGroup === targetGroup;
            });

            if (filteredChannels.length > 0) {
                filteredChannels.forEach((ch, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'ch-btn';
                    
                    let img = document.createElement('img');
                    img.src = ch.logo;
                    img.onerror = () => { img.src = "https://i.postimg.cc/W1z5BGPZ/20240823_024712.png"; };
                    
                    let strong = document.createElement('strong');
                    strong.innerText = ch.name;
                    
                    btn.appendChild(img);
                    btn.appendChild(strong);
                    
                    btn.onclick = () => loadChannel(ch);
                    container.appendChild(btn);
                });

                if (filteredChannels.length > 0 && (!currentUrl || !filteredChannels.some(c => Array.isArray(c.url) ? c.url.includes(currentUrl) : c.url === currentUrl))) {
                    loadChannel(filteredChannels[0]);
                }
            } else {
                container.innerHTML = '<p style="text-align: center; color: #888; grid-column: span 4; padding: 20px;">এই ক্যাটাগরিতে কোনো চ্যানেল পাওয়া যায়নি।</p>';
            }
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentFilter = category;
            renderChannels();
        }

        const playlistUrl = 'https://raw.githubusercontent.com/bushmr263-ship-it/online-tv/main/playlist.m3u?t=' + new Date().getTime();

        fetch(playlistUrl, { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                const lines = data.split(/\r?\n/);
                allChannels = [];
                
                let currentTitle = '';
                let currentLogo = 'https://i.postimg.cc/W1z5BGPZ/20240823_024712.png';
                let currentGroup = 'bangla'; // ডিফল্ট গ্রুপ

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();

                    // ১. প্লেলিস্টের কমেন্ট বা হেডার থেকে ক্যাটাগরি ডিটেক্ট করা
                    if (line.startsWith('#') && !line.startsWith('#EXTINF')) {
                        let upperLine = line.toUpperCase();
                        
                        if (upperLine.includes('INDIAN BANGLA') || upperLine.includes('JALSHA') || upperLine.includes('ZEE BANGLA')) {
                            currentGroup = 'indian_bangla';
                        } else if (upperLine.includes('SPORT') || upperLine.includes('CRICKET')) {
                            currentGroup = 'sports';
                        } else if (upperLine.includes('BANGLA') && !upperLine.includes('HINDI') && !upperLine.includes('INDIAN')) {
                            currentGroup = 'bangla';
                        } else if (upperLine.includes('HINDI') || upperLine.includes('REGIONAL') || upperLine.includes('BOLLYWOOD')) {
                            currentGroup = 'hindi';
                        } else if (upperLine.includes('CARTOON') || upperLine.includes('KIDS')) {
                            currentGroup = 'cartoon';
                        } else if (upperLine.includes('ENGLISH') || upperLine.includes('MOVIES')) {
                            currentGroup = 'english';
                        } else if (upperLine.includes('MUSIC')) {
                            currentGroup = 'music';
                        } else if (upperLine.includes('DOCUMENTARY') || upperLine.includes('DOCU')) {
                            currentGroup = 'documentary';
                        }
                        continue;
                    }

                    // ২. চ্যানেল ইনফো ও ইন্ডিভিজুয়াল group-title চেক করা
                    if (line.startsWith('#EXTINF')) {
                        let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        currentLogo = logoMatch ? logoMatch[1] : 'https://i.postimg.cc/W1z5BGPZ/20240823_024712.png';
                        
                        let groupMatch = line.match(/group-title="([^"]+)"/);
                        if (groupMatch) {
                            let gTitle = groupMatch[1].trim().toLowerCase();
                            if (gTitle.includes('indian')) {
                                currentGroup = 'indian_bangla';
                            } else if (gTitle.includes('sport') || gTitle.includes('cricket')) {
                                currentGroup = 'sports';
                            } else if (gTitle.includes('hindi')) {
                                currentGroup = 'hindi';
                            } else if (gTitle.includes('cartoon') || gTitle.includes('kids')) {
                                currentGroup = 'cartoon';
                            } else if (gTitle.includes('english')) {
                                currentGroup = 'english';
                            } else if (gTitle.includes('music')) {
                                currentGroup = 'music';
                            } else if (gTitle.includes('docu')) {
                                currentGroup = 'documentary';
                            } else if (gTitle.includes('bangla')) {
                                currentGroup = 'bangla';
                            }
                        }
                        
                        let nameParts = line.split(',');
                        currentTitle = nameParts[nameParts.length - 1].trim();
                    } 
                    else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            let rawUrls = [];
                            let matches = line.match(/(https?:\/\/[^\s]+)/g);
                            if (matches) {
                                rawUrls = matches.map(u => u.trim());
                            } else {
                                rawUrls = [line];
                            }

                            allChannels.push({
                                name: currentTitle,
                                logo: currentLogo,
                                url: rawUrls.length === 1 ? rawUrls[0] : rawUrls,
                                group: currentGroup
                            });

                            currentTitle = '';
                        }
                    }
                }
                renderChannels();
            })
            .catch(err => {
                console.error('Error fetching playlist:', err);
                document.getElementById('channelContainer').innerHTML = '<p style="text-align: center; color: red; grid-column: span 4; padding: 20px;">প্লেলিস্ট লোড করতে সমস্যা হয়েছে!</p>';
            });
    </script>
