<script>
    (function () {
        const path = window.location.pathname.toLowerCase();

        // login.html পেজে থাকলে index.html-এর গার্ড চলবে না
        if (path.endsWith("login.html")) {
            return;
        }

        const user = localStorage.getItem("pb_logged_username");
        const device = localStorage.getItem("pb_device_id");

        function goLogin(msg) {
            if (msg) alert(msg);
            localStorage.removeItem("pb_logged_username");
            localStorage.removeItem("pb_device_id");
            window.location.replace("login.html");
        }

        // যেকোনো ডোমেইন থেকেই লগইন না থাকলে সরাসরি login.html-এ পাঠাবে
        if (!user || !device) {
            goLogin();
            return;
        }

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);

        fetch("https://admin.bushmr263.workers.dev/get-users", {
            cache: "no-store",
            signal: controller.signal
        })
            .then(res => res.json())
            .then(data => {
                clearTimeout(timer);
                let record = null;

                if (Array.isArray(data)) {
                    record = data.find(u => u && String(u.username || u.user) === user);
                } else if (data && typeof data === "object") {
                    record = data[user] || null;
                }

                if (!record || record.active === false) {
                    goLogin("আপনার অ্যাকাউন্টটি ব্লক বা বাতিল করা হয়েছে!");
                }
            })
            .catch(() => {
                clearTimeout(timer);
            });
    })();
</script>
