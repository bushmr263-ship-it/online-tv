<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PB TV - অ্যাডমিন ড্যাশবোর্ড</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 25px; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #f59e0b; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto 25px auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .card h3 { color: #38bdf8; font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group input { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        
        .btn-add { width: 100%; padding: 11px; background: #f59e0b; border: none; border-radius: 6px; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-add:hover { background: #d97706; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; text-align: center; }
        .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .stat-box h4 { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .stat-box p { font-size: 20px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #0f172a; color: #94a3b8; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #166534; color: #4ade80; }
        .badge-blocked { background: #991b1b; color: #f87171; }
        
        .btn-action { padding: 5px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-toggle { background: #2563eb; color: #fff; }
        .btn-delete { background: #dc2626; color: #fff; }
        .device-code { font-family: monospace; color: #38bdf8; background: #0f172a; padding: 3px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fa-solid fa-tv"></i> পিবি টিভি অ্যাডমিন ড্যাশবোর্ড</h2>
    </div>

    <div class="grid">
        <div class="card">
            <h3><i class="fa-solid fa-user-plus"></i> নতুন ইউজার তৈরি করুন</h3>
            <div class="input-group">
                <input type="text" id="newUsername" placeholder="ইউজারনেম দিন">
            </div>
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="পাসওয়ার্ড দিন">
            </div>
            <button class="btn-add" onclick="addUser()"><i class="fa-solid fa-plus"></i> ইউজার যোগ করুন</button>
        </div>

        <div class="card" style="text-align: center;">
